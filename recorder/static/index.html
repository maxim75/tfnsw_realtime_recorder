<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle position recorder</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#fff; --line:#e5e5ea; --ok:#1a7f37; --bad:#c62828; --accent:#0a58ca; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f7; --muted:#a1a1a6; --bg:#151517; --line:#2c2c2e; --ok:#3fb950; --bad:#ff6b6b; --accent:#6ea8fe; } }
  body { margin:0; padding:16px; font:14px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  header, section { margin-bottom:20px; }
  .bar { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .wrap { overflow-x:auto; }
  input[type=number] { width:80px; }
  button { padding:6px 14px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .cities { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 12px; border-bottom:1px solid var(--line); }
  .cities button { border:0; border-bottom:2px solid transparent; background:transparent; color:inherit; font:inherit; padding:6px 14px; cursor:pointer; }
  .cities button.on { border-bottom-color:var(--accent); font-weight:600; }
  .cities button.off { color:var(--muted); }
  .err { color:var(--bad); max-width:320px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vehicle position recorder</h1>
    <nav id="cities" class="cities" aria-label="City"></nav>
    <div class="bar">
      <span id="state" class="muted">Loading…</span>
      <span id="uptime" class="muted"></span>
      <label>Interval <input id="interval" type="number" min="10" max="3600" step="1"> s</label>
      <span id="quota"></span>
      <button id="save" disabled>Save</button>
      <span id="msg" class="muted"></span>
    </div>
  </header>

  <section>
    <h2>Feeds</h2>
    <div class="wrap">
      <table>
        <thead><tr>
          <th>On</th><th>Feed</th><th>Last poll</th><th class="num">Vehicles</th>
          <th class="num">Rows in window</th><th>Current file</th><th>Last error</th>
        </tr></thead>
        <tbody id="feeds"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Uploads</h2>
    <div id="uploads" class="muted">Loading…</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let dirty = false;
let cities = [];
let city = null;   // the selected city object from /api/cities
const cityParam = () => `city=${encodeURIComponent(city.id)}`;

function fmtUptime(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return `up ${d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m` : `${m}m`}`;
}

const fmtTime = (iso) => iso
  ? new Date(iso).toLocaleString("en-AU", { timeZone: city ? city.timezone : undefined, hour12: false })
  : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// location.origin never carries user:pass@, which fetch() rejects in relative URLs.
const api = (path) => new URL(path, location.origin);
const fmtAge = (sec) => {
  if (sec == null) return "—";
  const units = [[86400 * 365, "y"], [86400, "d"], [3600, "h"], [60, "m"]];
  for (const [n, u] of units) if (sec >= n) return `${Math.floor(sec / n)}${u}`;
  return `${Math.round(sec)}s`;
};

function quotaText(feeds, interval) {
  const perDay = Math.round(feeds * 86400 / interval);
  return { perDay, text: `${perDay.toLocaleString()} requests/day of ${city.daily_quota.toLocaleString()}` };
}

function updateQuota() {
  if (!city || city.daily_quota == null) { $("quota").textContent = ""; return; }  // no daily limit
  const feeds = document.querySelectorAll("#feeds input:checked").length;
  const interval = Number($("interval").value) || 1;
  const q = quotaText(feeds, interval);
  $("quota").textContent = q.text;
  $("quota").className = q.perDay > city.daily_quota ? "bad" : "muted";
}

function markDirty() { dirty = true; $("save").disabled = false; updateQuota(); }

function renderCities() {
  $("cities").innerHTML = cities.map((c) =>
    `<button data-city="${esc(c.id)}" class="${c.id === city.id ? "on" : ""} ${c.enabled ? "" : "off"}">${esc(c.name)}</button>`).join("");
  document.querySelectorAll("#cities button").forEach((b) => b.addEventListener("click", () => selectCity(b.dataset.city)));
}

function selectCity(id) {
  const c = cities.find((x) => x.id === id);
  if (!c || (city && c.id === city.id)) return;
  city = c;
  history.replaceState(null, "", "#" + c.id);
  dirty = false; $("save").disabled = true; $("msg").textContent = "";
  $("feeds").innerHTML = ""; $("state").textContent = "Loading…"; $("uptime").textContent = "";
  renderCities(); updateQuota();
  refresh();
}

function render(s) {
  if (s.city !== city.id) return;  // a slow response for a city that is no longer selected
  $("state").textContent = s.recorder.alive ? "● Recording"
    : s.recorder.disabled_reason ? `● Disabled: ${s.recorder.disabled_reason}` : "● Stopped";
  $("state").className = s.recorder.alive ? "ok" : "bad";
  $("uptime").textContent = s.recorder.started_at
    ? `${fmtUptime(s.recorder.started_at)} · since ${fmtTime(s.recorder.started_at)}` : "";
  if (!dirty) $("interval").value = s.settings.interval;

  const checked = dirty
    ? new Set([...document.querySelectorAll("#feeds input:checked")].map((i) => i.value))
    : new Set(s.settings.feeds);
  $("feeds").innerHTML = s.feeds.map((f) => `
    <tr>
      <td><input type="checkbox" value="${esc(f.feed)}" ${checked.has(f.feed) ? "checked" : ""}></td>
      <td>${esc(f.feed)} ${f.version ? `<span class="tag">${esc(f.version)}</span>` : ""}</td>
      <td>${fmtTime(f.last_poll_at)}</td>
      <td class="num">${f.vehicles ?? "—"}${f.stale
        ? `<br><span class="bad" title="Newest GPS report is ${fmtAge(f.data_age_s)} old">stale · ${fmtAge(f.data_age_s)}</span>`
        : ""}</td>
      <td class="num">${f.rows_in_window ?? "—"}</td>
      <td class="muted">${esc(f.current_file ?? "—")}</td>
      <td class="err">${f.last_error ? `${esc(f.last_error)}<br><span class="muted">${fmtTime(f.last_error_at)}</span>` : ""}</td>
    </tr>`).join("");
  document.querySelectorAll("#feeds input").forEach((i) => i.addEventListener("change", markDirty));
  updateQuota();

  const u = s.uploader;
  $("uploads").innerHTML = u.s3_configured
    ? `Bucket <b>${esc(u.bucket)}</b> · pending <b>${u.pending}</b> · uploaded <b>${u.uploaded_total}</b><br>
       Last upload: ${esc(u.last_uploaded_key ?? "—")} ${u.last_uploaded_at ? "at " + fmtTime(u.last_uploaded_at) : ""}
       ${u.last_error ? `<div class="err">Last error (${fmtTime(u.last_error_at)}): ${esc(u.last_error)}</div>` : ""}`
    : `<span class="bad">S3 not configured</span> — ${u.pending} completed files kept locally.`;
}

async function refresh() {
  if (!city) return;
  try {
    const r = await fetch(api(`/api/status?${cityParam()}`));
    if (r.ok) render(await r.json());
  } catch (e) { $("msg").textContent = "Status unavailable"; }
}

async function init() {
  try {
    const r = await fetch(api("/api/cities"));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    cities = await r.json();
  } catch (e) { $("state").textContent = "Cities unavailable"; return; }
  if (!cities.length) { $("state").textContent = "No cities configured"; return; }
  const want = location.hash.slice(1);
  city = cities.find((c) => c.id === want) || cities.find((c) => c.enabled) || cities[0];
  renderCities(); updateQuota();
  refresh();
  setInterval(refresh, 5000);
}

$("interval").addEventListener("input", markDirty);
$("save").addEventListener("click", async () => {
  const feeds = [...document.querySelectorAll("#feeds input:checked")].map((i) => i.value);
  const r = await fetch(api(`/api/settings?${cityParam()}`), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ feeds, interval: Number($("interval").value) }),
  });
  if (r.ok) {
    dirty = false; $("save").disabled = true;
    $("msg").textContent = "Saved — applies at the next poll"; $("msg").className = "ok";
    refresh();
  } else {
    const body = await r.json().catch(() => ({}));
    $("msg").textContent = body.detail || `Error ${r.status}`; $("msg").className = "bad";
  }
});

init();
</script>
</body>
</html>
