<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live vehicle map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --panel:rgba(255,255,255,.94); --line:#e5e5ea; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f7; --muted:#a1a1a6; --panel:rgba(28,28,30,.94); --line:#3a3a3c; --ok:#3fb950; --bad:#ff6b6b; } }
  html, body, #map { margin:0; height:100%; }
  body { font:13px/1.4 system-ui, sans-serif; color:var(--fg); background:#e9e9e9; }
  #panel { position:absolute; top:12px; left:12px; z-index:2; width:270px; max-width:calc(100vw - 48px);
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  #panel h1 { font-size:15px; margin:0 0 4px; }
  #panel a { color:inherit; }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .row { margin-top:8px; }
  .feeds { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
  label { white-space:nowrap; }
  input[type=text] { width:100%; box-sizing:border-box; padding:4px 6px; }
  select { padding:2px; }
  details summary { cursor:pointer; }
  @media (max-width:500px) { #panel { width:auto; right:12px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Live vehicles</h1>
  <div id="state" class="muted">Loading…</div>
  <details open>
    <summary class="row muted">Options</summary>
    <div class="row feeds" id="feeds"></div>
    <div class="row"><input id="routes" type="text" placeholder="Routes, e.g. 333, 380, T1" autocomplete="off"></div>
    <div class="row">
      Colour <select id="colour"><option value="route">by route</option><option value="speed">by speed</option><option value="mode">by mode</option></select>
      <label><input id="trails" type="checkbox" checked> Trails</label>
    </div>
    <div class="row">
      Delay <select id="delay"><option>30</option><option selected>60</option><option>90</option><option>120</option></select> s
      <span class="muted" title="Vehicles are drawn this far in the past, between reports already received, so they move smoothly">ⓘ</span>
    </div>
    <div class="row muted"><a href="/">Recorder status</a></div>
  </details>
</div>
<script>
const api = (path) => new URL(path, location.origin);  // origin never carries user:pass@
const GROUPS = [
  ["buses", "Buses", (f) => f === "buses", true],
  ["sydneytrains", "Trains", (f) => f === "sydneytrains", false],
  ["metro", "Metro", (f) => f === "metro", false],
  ["nswtrains", "TrainLink", (f) => f === "nswtrains", false],
  ["ferries", "Ferries", (f) => f.startsWith("ferries"), false],
  ["lightrail", "Light rail", (f) => f.startsWith("lightrail"), false],
  ["regionbuses", "Regional buses", (f) => f.startsWith("regionbuses"), false],
];
const MODE_COLOURS = { buses: [0, 112, 210], sydneytrains: [242, 133, 0], metro: [22, 128, 128], nswtrains: [217, 75, 35],
                       ferries: [0, 150, 70], lightrail: [196, 30, 58], regionbuses: [120, 80, 180] };
// HIDE_AFTER_S: a vehicle with no report for this long (trip ended, out of service) is no longer drawn.
const HISTORY = 8, FORGET_S = 600, HIDE_AFTER_S = 150, MAX_GAP_S = 180, TRAIL_S = 90;

const vehicles = new Map();  // "feed|vehicle" -> {feed, group, vid, route, label, reports: [[ts, lon, lat, bearing, speed]]}
let lastBatchAt = 0, tripsVersion = 0;
const base = Math.floor(Date.now() / 1000) - 3600;  // keeps TripsLayer timestamps small (float32)

const groupOf = (feed) => (GROUPS.find(([, , match]) => match(feed)) || ["buses"])[0];
const shortRoute = (route) => route.includes("_") ? route.slice(route.lastIndexOf("_") + 1) : route;

function addReport(feed, r) {
  const [vid, route, ts, lon, lat, bearing, speed] = r;
  const key = feed + "|" + vid;
  let v = vehicles.get(key);
  if (!v) vehicles.set(key, v = { feed, group: groupOf(feed), vid, route, label: shortRoute(route), reports: [] });
  const last = v.reports[v.reports.length - 1];
  if (last && ts <= last[0]) return;
  v.route = route; v.label = shortRoute(route);
  v.reports.push([ts, lon, lat, bearing, speed]);
  if (v.reports.length > HISTORY) v.reports.shift();
}

// --- colours ---------------------------------------------------------------
function hashColour(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue = h % 360, sat = 0.7, light = 0.45;  // HSL -> RGB
  const k = (n) => (n + hue / 30) % 12, a = sat * Math.min(light, 1 - light);
  const f = (n) => Math.round(255 * (light - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return [f(0), f(8), f(4)];
}
function speedColour(mps) {
  if (mps == null) return [140, 140, 140];
  const t = Math.min(1, mps / 15);  // 0 km/h red -> 54 km/h green
  return [Math.round(220 * (1 - t) + 30 * t), Math.round(50 * (1 - t) + 160 * t), 60];
}
const routeColours = new Map();
function colourFor(v, mode, speed) {
  if (mode === "speed") return speedColour(speed);
  if (mode === "mode") return MODE_COLOURS[v.group];
  if (!routeColours.has(v.route)) routeColours.set(v.route, hashColour(v.route));
  return routeColours.get(v.route);
}

// --- interpolation -----------------------------------------------------------
const toRad = Math.PI / 180;
function headingDeg(lon0, lat0, lon1, lat1) {
  const y = Math.sin((lon1 - lon0) * toRad) * Math.cos(lat1 * toRad);
  const x = Math.cos(lat0 * toRad) * Math.sin(lat1 * toRad) - Math.sin(lat0 * toRad) * Math.cos(lat1 * toRad) * Math.cos((lon1 - lon0) * toRad);
  return (Math.atan2(y, x) / toRad + 360) % 360;
}
const metres = (lon0, lat0, lon1, lat1) =>
  Math.hypot((lon1 - lon0) * 111320 * Math.cos(lat0 * toRad), (lat1 - lat0) * 110540);

/** Position of vehicle *v* at time *t*: between its two reports around t, else held at the nearest one. */
function positionAt(v, t) {
  const rs = v.reports;
  if (t <= rs[0][0]) return [rs[0][1], rs[0][2], rs[0][3], rs[0][4]];
  for (let i = rs.length - 1; i >= 0; i--) {
    if (rs[i][0] > t) continue;
    const a = rs[i], b = rs[i + 1];
    if (!b || b[0] - a[0] > MAX_GAP_S) return [a[1], a[2], a[3], a[4]];
    const f = (t - a[0]) / (b[0] - a[0]);
    const moved = metres(a[1], a[2], b[1], b[2]) > 5;
    return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f,
            moved ? headingDeg(a[1], a[2], b[1], b[2]) : (b[3] ?? a[3]), b[4]];
  }
}

// --- filters -----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
$("feeds").innerHTML = GROUPS.map(([g, name, , on]) =>
  `<label><input type="checkbox" value="${g}" ${on ? "checked" : ""}> ${name}</label>`).join("");
let enabledGroups, routeFilter;
function readFilters() {
  enabledGroups = new Set([...document.querySelectorAll("#feeds input:checked")].map((i) => i.value));
  const routes = $("routes").value.split(/[\s,]+/).filter(Boolean).map((s) => s.toUpperCase());
  routeFilter = routes.length ? new Set(routes) : null;
  tripsVersion++;
}
document.querySelectorAll("#panel input, #panel select").forEach((el) => el.addEventListener("input", readFilters));
readFilters();
const visible = (v) => enabledGroups.has(v.group) && (!routeFilter || routeFilter.has(v.label.toUpperCase()) || routeFilter.has(v.route.toUpperCase()));

// --- map ---------------------------------------------------------------------
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = new maplibregl.Map({
  container: "map",
  style: `https://tiles.openfreemap.org/styles/${dark ? "dark" : "positron"}`,
  center: [151.05, -33.85], zoom: 10.3, maxZoom: 19, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "top-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

const ARROW = {
  url: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
    '<path d="M32 4 L54 56 L32 44 L10 56 Z" fill="#fff"/></svg>'),
  width: 64, height: 64, anchorY: 32, mask: true,
};

const overlay = new deck.MapboxOverlay({
  interleaved: true,
  getTooltip: ({ object: d }) => d && {
    html: `<b>${d.v.group === "buses" ? "Route" : ""} ${d.v.label || "—"}</b> <span style="opacity:.7">${d.v.feed}</span><br>` +
          `Vehicle ${d.v.vid}<br>${d.speed == null ? "" : `${Math.round(d.speed * 3.6)} km/h · `}` +
          `report ${new Date(d.ts * 1000).toLocaleTimeString("en-AU", { timeZone: "Australia/Sydney", hour12: false })}`,
    style: { fontSize: "12px", padding: "6px 8px" },
  },
});
map.addControl(overlay);

let trips = [];
function buildTrips() {
  trips = [];
  for (const v of vehicles.values()) {
    if (v.reports.length < 2 || !visible(v)) continue;
    trips.push({ v, path: v.reports.map((r) => [r[1], r[2]]), times: v.reports.map((r) => r[0] - base) });
  }
}

function frame() {
  const delay = Number($("delay").value);
  const t = Date.now() / 1000 - delay;
  const mode = $("colour").value, zoom = map.getZoom();
  const points = [];
  for (const v of vehicles.values()) {
    if (!visible(v)) continue;
    const last = v.reports[v.reports.length - 1];
    if (t - last[0] > HIDE_AFTER_S) continue;
    const [lon, lat, angle, speed] = positionAt(v, t);
    points.push({ v, position: [lon, lat], angle: angle ?? 0, speed, ts: last[0], colour: colourFor(v, mode, speed) });
  }
  if (tripsVersion !== frame.builtVersion) { buildTrips(); frame.builtVersion = tripsVersion; }
  const arrows = zoom >= 13.5;
  overlay.setProps({
    layers: [
      new deck.TripsLayer({
        id: "trails", data: trips, visible: $("trails").checked,
        getPath: (d) => d.path, getTimestamps: (d) => d.times,
        getColor: (d) => colourFor(d.v, mode === "speed" ? "route" : mode),
        currentTime: t - base, trailLength: TRAIL_S, fadeTrail: true,
        widthUnits: "pixels", getWidth: 3, opacity: 0.45, capRounded: true, jointRounded: true,
        updateTriggers: { getColor: [mode, tripsVersion] },
      }),
      new deck.ScatterplotLayer({
        id: "dots", data: points, visible: !arrows, pickable: true,
        getPosition: (d) => d.position, getFillColor: (d) => d.colour,
        radiusUnits: "pixels", getRadius: zoom < 11 ? 2.5 : 4,
        stroked: true, getLineColor: [255, 255, 255, 200], lineWidthUnits: "pixels", getLineWidth: 0.75,
      }),
      new deck.IconLayer({
        id: "arrows", data: points, visible: arrows, pickable: true,
        getPosition: (d) => d.position, getIcon: () => ARROW, getColor: (d) => d.colour,
        getAngle: (d) => -d.angle, sizeUnits: "pixels", getSize: zoom >= 16 ? 26 : 18,
      }),
      new deck.TextLayer({
        id: "labels", data: points, visible: zoom >= 15,
        getPosition: (d) => d.position, getText: (d) => d.v.label, getSize: 11,
        getPixelOffset: [0, -18], getColor: dark ? [240, 240, 240] : [30, 30, 30],
        fontWeight: 600, outlineWidth: 3, outlineColor: dark ? [0, 0, 0, 200] : [255, 255, 255, 220],
        fontSettings: { sdf: true },
      }),
    ],
  });
  const age = lastBatchAt ? Math.round((Date.now() - lastBatchAt) / 1000) : null;
  $("state").innerHTML = `<span class="${age != null && age < 90 ? "ok" : "bad"}">●</span> ${points.length.toLocaleString()} vehicles` +
    ` <span class="muted">· update ${age == null ? "—" : age + " s ago"}</span>`;
  requestAnimationFrame(frame);
}

// --- data --------------------------------------------------------------------
async function start() {
  const r = await fetch(api("/api/live"));
  if (!r.ok) { $("state").textContent = `Error ${r.status} loading positions`; return; }
  const snap = await r.json();
  for (const [feed, reports] of Object.entries(snap.feeds)) for (const rep of reports) addReport(feed, rep);
  lastBatchAt = Date.now(); tripsVersion++;
  const es = new EventSource(api(`/api/live/stream?since=${snap.seq}`));
  es.onmessage = (e) => {
    const batch = JSON.parse(e.data);
    for (const rep of batch.reports) addReport(batch.feed, rep);
    lastBatchAt = Date.now(); tripsVersion++;
  };
  setInterval(() => {  // forget vehicles that stopped reporting
    const cutoff = Date.now() / 1000 - FORGET_S - 300;
    for (const [k, v] of vehicles) if (v.reports[v.reports.length - 1][0] < cutoff) vehicles.delete(k);
  }, 30000);
  requestAnimationFrame(frame);
}
map.on("load", start);
</script>
</body>
</html>
