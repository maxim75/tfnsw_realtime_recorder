[sydney]
name = "Sydney"
timezone = "Australia/Sydney"
center = [151.05, -33.85]            # lon, lat
zoom = 10.3
s3_prefix = "vehiclepos"             # existing layout; env S3_PREFIX overrides it
attribution = "Transport for NSW (CC BY 4.0)"
interval = 30                        # default poll interval, s
max_requests_per_second = 5
daily_quota = 60000
default_feeds = [
    "buses",
    "sydneytrains",
    "metro",
    "nswtrains",
    "ferries/sydneyferries",
    "ferries/MFF",
    "lightrail/cbdandsoutheast",
    "lightrail/innerwest",
    "lightrail/parramatta",
    "regionbuses/sydneysurrounds",
]
route_label = { pattern = '_(?P<label>[^_]+)$' }          # 2510_333 -> 333
headers = { Authorization = "apikey ${TFNSW_API_KEY}" }   # env expanded at load

  [[sydney.feeds]]
  id = "buses"
  url = "https://api.transport.nsw.gov.au/v1/gtfs/vehiclepos/buses"
  mode = "bus"

  [[sydney.feeds]]
  id = "sydneytrains"
  url = "https://api.transport.nsw.gov.au/v2/gtfs/vehiclepos/sydneytrains"
  mode = "rail"

  [[sydney.feeds]]
