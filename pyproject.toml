[project]
name = "tfnsw-realtime-recorder"
version = "0.1.0"
description = "Record TfNSW live vehicle positions to 10-minute files and upload them to S3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "fastapi>=0.143.2",
    "gtfs-realtime-bindings>=3.0.0",
    "requests>=2.34.2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
